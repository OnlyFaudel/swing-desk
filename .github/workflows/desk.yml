name: swing-desk
on:
  schedule:
    # Every 15 min, about 6am-7pm ET on weekdays (public repo: GitHub Actions minutes are free).
    # Each run is ONE quick pass (~2 min). Buy orders and stops rest at the broker and fill on their own between runs.
    # If you ever make the repo private, cut this back: private repos get 2,000 free minutes a month.
    - cron: "*/15 11-23 * * 1-5"
    # overnight and weekends: hourly, so your posts get answered and news is still read
    - cron: "7 0-10 * * 1-5"
    - cron: "7 */2 * * 0,6"
    # Saturday 10am ET: weekend research session (the agents test ideas on the practice trades)
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop | once | first-run | research | test-notify | test-agents | test-broker | force-morning | force-review"
        default: "once"
permissions:
  contents: write
concurrency:
  group: swing-desk
  cancel-in-progress: false
jobs:
  run:
    # Hawk mode on the always-on VM: set the repo variable RUNNER=vm and scheduled runs stop here (no minutes used).
    if: github.event_name != 'schedule' || vars.RUNNER != 'vm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run desk
        env:
          TZ: America/New_York
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "0 15 * * 6" ]; then MODE=research; fi
          case "$MODE" in
            "") python run.py once ;;
            loop) python run.py loop --minutes 13 ;;
            once) python run.py once ;;
            first-run) python run.py once --force-rank --force-morning --force-review ;;
            force-morning) python run.py once --force-morning ;;
            force-review) python run.py once --force-review ;;
            *) python run.py "$MODE" ;;
          esac
      - name: Save state + dashboard
        if: always()
        run: |
          git config user.name "swing-desk"
          git config user.email "swing-desk@users.noreply.github.com"
          # add each path on its own: one missing folder must not stop the rest from being saved
          for p in state.json docs orders data memory research/trial_ledger.json research/discoveries.json; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "desk $(date -u +%F_%H%M)"
          git pull --rebase --autostash && git push

  # When the bot lives on the always-on VM (RUNNER=vm): every hour on weekdays, check it is still alive and ping the phone if not.
  watchdog:
    if: github.event_name == 'schedule' && vars.RUNNER == 'vm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Is the VM alive?
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as dt, urllib.request, zoneinfo
          now = dt.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          st = json.load(open("state.json"))
          hb = st.get("heartbeat") or (st.get("last_cycle") or "")[:16]
          try:
              age = (now.replace(tzinfo=None) - dt.datetime.strptime(hb, "%Y-%m-%d %H:%M")).total_seconds() / 60
          except ValueError:
              age = 9999
          print("last heartbeat", hb, f"{age:.0f} min ago")
          market = now.weekday() < 5 and dt.time(9, 45) <= now.time() <= dt.time(16, 0)
          if market and age > 45:
              h = {"Title": "Swing Desk VM is quiet", "Priority": "high", "Tags": "rotating_light"}
              if os.environ.get("NTFY_TOKEN"): h["Authorization"] = "Bearer " + os.environ["NTFY_TOKEN"]
              req = urllib.request.Request("https://ntfy.sh/" + os.environ["NTFY_TOPIC"], method="POST", headers=h,
                  data=f"No update from the always-on computer for {age:.0f} minutes. It may be stuck or off.".encode())
              urllib.request.urlopen(req, timeout=20)
          PY
